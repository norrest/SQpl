#======================= Global Settings =======================

[global]
   workgroup = WORKGROUP
   server string = StereoQ Player
   dns proxy = no
   interfaces = lo eth0
   bind interfaces only = yes
   smb ports = 445
   disable netbios = yes
   name resolve order = host
   unix extensions = no
   log level = 0
   syslog = 0

   # Auth model for Windows 11
   security = user
   map to guest = Never
   guest account = nobody

   # Protocol floor and ceiling
   server min protocol = SMB2
   server max protocol = SMB3

   # No printers
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # Do not try to be network browser master
   domain master = no
   local master = no
   preferred master = no

   # Default permissions for created files and dirs
   create mask = 0777
   directory mask = 0777


#======================= Share Definitions =======================

[WebRadio]
   comment = WebRadio Folder
   path = /var/lib/mpd/music/WEBRADIO
   browseable = yes
   read only = no
   guest ok = no
   valid users = root
   force user = root
   follow symlinks = yes
   wide links = yes
   nt acl support = no
   inherit owner = yes


[Volumio disk]
   comment = Volumio stored music library
   path = /var/lib/mpd/music/USB
   browseable = yes
   read only = no
   guest ok = no
   valid users = root
   force user = root
   follow symlinks = yes
   wide links = yes
   allow insecure wide links = yes
   nt acl support = no
   inherit owner = yes


[WARNING ONLY FOR PLAYLIST]
   comment = ONLY FOR PLAYLIST DONT COPY MUSIC
   path = /var/lib/mpd/playlists/
   browseable = yes
   read only = no
   guest ok = no
   valid users = root
   force user = root
   follow symlinks = yes
   wide links = yes
   nt acl support = no
   inherit owner = yes
